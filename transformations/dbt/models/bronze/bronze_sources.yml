version: 2
sources:
- name: bronze
  description: Versioned Bronze datasets catalogued in AWS Glue.
  database: awsdatacatalog
  schema: thesis_pac_dev_bronze
  tables:
  - name: olist_customers
    description: Existing governed Bronze Glue table used as a dbt source.
    columns:
    - name: customer_id
      data_type: string
    - name: customer_unique_id
      data_type: string
    - name: customer_zip_code_prefix
      data_type: string
    - name: customer_city
      data_type: string
    - name: customer_state
      data_type: string
  - name: olist_geolocation
    description: Existing governed Bronze Glue table used as a dbt source.
    columns:
    - name: geolocation_zip_code_prefix
