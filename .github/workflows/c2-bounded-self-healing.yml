name: C2 Bounded Self-Healing Pipeline v1

run-name: "C2 | ${{ inputs.scenario }} | bounded-self-healing | run-${{ github.run_number }}-${{ github.run_attempt }}"

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Controlled C2 fault scenario"
        required: true
        type: choice
        options:
          - schema_break
          - pii_exposure
          - freshness_breach
          - quality_regression
          - policy_false_positive

      expected_commit:
        description: "Exact 40-character C2 Git commit to execute"
        required: true
        type: string

      c1_run_id:
        description: "C1 workflow run ID containing policy evidence artifact"
        required: true
        type: string

      c1_run_attempt:
        description: "C1 workflow run attempt number"
        required: true
        type: string


permissions:
  contents: read
  actions: read
  id-token: write


env:
  AWS_REGION: eu-west-1
  AWS_DEFAULT_REGION: eu-west-1
  AWS_ACCOUNT_ID: "522814714524"
  DATA_LAKE_BUCKET: thesis-pac-dev-data-lake-522814714524-eu-west-1
  ATHENA_RESULTS_BUCKET: thesis-pac-dev-athena-results-522814714524-eu-west-1
  DBT_ATHENA_WORKGROUP: thesis-pac-dev-dbt-transform
  EXPECTED_C2_BRANCH: feature/c2-bounded-self-healing
  C2_GITHUB_ROLE_ARN: arn:aws:iam::522814714524:role/thesis-pac-dev-github-c2


jobs:

  c2-foundation:

    name: "C2 bounded self-healing | ${{ inputs.scenario }}"

    runs-on: ubuntu-latest
    timeout-minutes: 20


    steps:

      - name: Checkout locked C2 revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0


      - name: Guard manual C2 branch and immutable revision
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"

          test "${GITHUB_REF}" = "refs/heads/${EXPECTED_C2_BRANCH}"

          test "${TRIGGER_SHA}" = "${EXPECTED_COMMIT}"

          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"

          test -z "$(git status --porcelain)"

          echo "C2 immutable revision guard: PASS"


      - name: Setup Python 3.11.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11.14"


      - name: Install pinned C2 Python toolchain
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install             --disable-pip-version-check             "jsonschema==4.26.0"

          python3 -m pip install             --disable-pip-version-check             -e orchestration/dagster

          python3 - <<'PY'
          import importlib.metadata

          version = importlib.metadata.version("jsonschema")

          if version != "4.26.0":
              raise SystemExit(
                  f"Unexpected jsonschema version: {version}"
              )

          print(
              "Pinned C2 Python toolchain: PASS "
              f"(jsonschema={version})"
          )
          PY

          python3 -m pip check


      - name: Install OPA 1.19.0
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 15 \
            --max-time 120 \
            -L \
            -o opa \
            https://openpolicyagent.org/downloads/v1.19.0/opa_linux_amd64_static

          chmod +x opa

          sudo mv opa /usr/local/bin/opa

          opa version


      - name: Assume dedicated C2 AWS role through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.C2_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: thesis-pac-c2-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Verify C2 AWS identity
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          test "${ACCOUNT}" = "522814714524"

          ARN=$(aws sts get-caller-identity --query Arn --output text)

          case "${ARN}" in
            arn:aws:sts::522814714524:assumed-role/thesis-pac-dev-github-c2/*)
              ;;
            *)
              exit 1
              ;;
          esac

          echo "Dedicated C2 AWS identity: PASS"


      - name: Prepare C2 runtime
        shell: bash
        run: |
          mkdir -p \
            c2-runtime/input \
            c2-runtime/evidence \
            c2-runtime/workspace

          echo "C2 runtime directories: PASS"


      - name: Download C1 policy evidence artifact
        uses: actions/download-artifact@v7.0.0
        with:
          name: c1-policy-gated-${{ inputs.c1_run_id }}-${{ inputs.c1_run_attempt }}
          path: c2-runtime/input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.c1_run_id }}
          github-token: ${{ github.token }}


      - name: Prepare deterministic C1 policy input
        shell: bash
        env:
          C2_SCENARIO: ${{ inputs.scenario }}
        run: |
          set -euo pipefail

          case "${C2_SCENARIO}" in
            schema_break|pii_exposure|policy_false_positive)
              DECISION_NAME="policy-decision-pre.json"
              EXPECTED_STAGE="pre"
              ;;
            freshness_breach|quality_regression)
              DECISION_NAME="policy-decision-post.json"
              EXPECTED_STAGE="post"
              ;;
            *)
              echo "Unsupported C2 scenario: ${C2_SCENARIO}"
              exit 1
              ;;
          esac

          POLICY_DECISION="$(
            find c2-runtime/input               -type f               -name "${DECISION_NAME}"               -print               -quit
          )"

          if [ -z "${POLICY_DECISION}" ]; then
            echo "Expected C1 decision not found: ${DECISION_NAME}"
            echo "Downloaded C1 artifact contents:"
            find c2-runtime/input -type f -print | sort
            exit 1
          fi

          cp "${POLICY_DECISION}"             c2-runtime/input/policy-decision.json

          test -s c2-runtime/input/policy-decision.json

          PRE_GATE_EVIDENCE="$(
            find c2-runtime/input \
              -type f \
              -name 'pre-gate-evidence.json' \
              -print \
              -quit
          )"

          if [ -z "${PRE_GATE_EVIDENCE}" ]; then
            echo "Required C1 pre-gate evidence was not downloaded."
            find c2-runtime/input -type f -print | sort
            exit 1
          fi

          if [ "${PRE_GATE_EVIDENCE}" != \
            "c2-runtime/input/pre-gate-evidence.json" ]
          then
            cp "${PRE_GATE_EVIDENCE}" \
              c2-runtime/input/pre-gate-evidence.json
          fi

          test -s c2-runtime/input/pre-gate-evidence.json

          echo "C1 policy decision source: ${POLICY_DECISION}"
          echo "C1 pre-gate evidence source: ${PRE_GATE_EVIDENCE}"
          echo "C1 expected evaluation stage: ${EXPECTED_STAGE}"
          echo "C1 deterministic policy input: PASS"


      - name: Initialise C2 wrapper environment
        shell: bash
        env:
          C2_SCENARIO: ${{ inputs.scenario }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail

          RUN_KEY="gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          SOURCE_RUN_KEY="gha_${{ inputs.c1_run_id }}_${{ inputs.c1_run_attempt }}"
          SCHEMA_BASE="thesis_pac_c2_${RUN_KEY}"

          SILVER_SCHEMA="${SCHEMA_BASE}_silver"
          GOLD_INTERNAL_SCHEMA="${SCHEMA_BASE}_gold_internal"
          GOLD_PUBLIC_SCHEMA="${SCHEMA_BASE}_gold_public"

          PROFILE_DIR="${RUNNER_TEMP}/c2-dbt-profiles"
          DATA_ROOT="s3://${DATA_LAKE_BUCKET}/experiments/c2/github-actions/${RUN_KEY}/data/"
          RESULTS_ROOT="s3://${ATHENA_RESULTS_BUCKET}/experiments/c2/github-actions/${RUN_KEY}/athena/"

          mkdir -p "${PROFILE_DIR}"

          cp \
            transformations/dbt/profiles.yml.example \
            "${PROFILE_DIR}/profiles.yml"

          {
            echo "THESIS_GIT_BRANCH=${GITHUB_REF_NAME}"
            echo "THESIS_EXPERIMENT_CONDITION=C2"
            echo "THESIS_SCENARIO_ID=${C2_SCENARIO}"
            echo "THESIS_GIT_COMMIT=${EXPECTED_COMMIT}"
            echo "C2_RUN_KEY=${RUN_KEY}"
            echo "C2_SOURCE_RUN_KEY=${SOURCE_RUN_KEY}"
            echo "C2_TARGET_LAYER=gold_public"
            echo "DBT_ATHENA_SCHEMA=${SILVER_SCHEMA}"
            echo "DBT_GOLD_INTERNAL_SCHEMA=${GOLD_INTERNAL_SCHEMA}"
            echo "DBT_GOLD_PUBLIC_SCHEMA=${GOLD_PUBLIC_SCHEMA}"
            echo "DBT_ATHENA_STAGING_DIR=${RESULTS_ROOT}"
            echo "DBT_ATHENA_DATA_DIR=${DATA_ROOT}"
            echo "DBT_ATHENA_DATA_BUCKET=${DATA_LAKE_BUCKET}"
            echo "DBT_ZONE_EXTERNAL_ROOT=${DATA_ROOT%/}"
            echo "THESIS_DBT_PROFILES_DIR=${PROFILE_DIR}"
            echo "THESIS_DBT_MANIFEST_PATH=${GITHUB_WORKSPACE}/transformations/dbt/target/manifest.json"
            echo "THESIS_DBT_EXECUTABLE=$(command -v dbt)"
          } >> "${GITHUB_ENV}"


      - name: Prepare isolated C2 dbt manifest
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            transformations/dbt/target \
            transformations/dbt/logs

          dbt \
            --no-use-colors \
            --no-version-check \
            parse \
            --project-dir transformations/dbt \
            --profiles-dir "${THESIS_DBT_PROFILES_DIR}" \
            --target dev \
            > c2-runtime/evidence/dbt-parse.log \
            2>&1

          cat c2-runtime/evidence/dbt-parse.log

          test -s "${THESIS_DBT_MANIFEST_PATH}"


      - name: Execute deterministic C2 bounded self-healing wrapper
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/github_actions/run_c2_bounded_self_healing.py \
            --decision c2-runtime/input/policy-decision.json \
            --catalog policies/catalog/c2-remediation-catalog.json \
            --decision-schema policies/contracts/c2-policy-decision-projection.schema.json \
            --plan-schema policies/contracts/c2-remediation-plan.schema.json \
            --context-schema policies/contracts/c2-remediation-execution-context.schema.json \
            --result-schema policies/contracts/c2-remediation-result.schema.json \
            --pre-evidence c2-runtime/input/pre-gate-evidence.json \
            --opa-bin opa \
            --evidence-root c2-runtime/evidence

          echo "C2 wrapper execution: PASS"


      - name: Validate C2 completion evidence
        shell: bash
        run: |
          set -euo pipefail

          test -f c2-runtime/evidence/c2-runtime-complete.json

          echo "===== C2 completion evidence ====="

          cat c2-runtime/evidence/c2-runtime-complete.json

          echo "=================================="

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "c2-runtime/evidence/c2-runtime-complete.json"
              ).read_text()
          )

          assert payload["status"] == "PASS"
          assert payload["condition"] == "C2"

          print("C2 evidence validation: PASS")
          PY


      - name: Upload C2 evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.0
        with:
          name: c2-bounded-self-healing-${{ github.run_id }}-${{ github.run_attempt }}
          path: c2-runtime/evidence
          if-no-files-found: warn


      - name: Record C2 summary
        shell: bash
        env:
          C2_SCENARIO: ${{ inputs.scenario }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          {
            echo "## C2 bounded self-healing execution"
            echo
            echo "- Condition: C2"
            echo "- Scenario: ${C2_SCENARIO}"
            echo "- Commit: ${EXPECTED_COMMIT}"
            echo "- Recovery verification: enabled"
            echo "- Fallback request generation: enabled"
            echo "- Evidence artifact: uploaded"
          } >> "${GITHUB_STEP_SUMMARY}"
