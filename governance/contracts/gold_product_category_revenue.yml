dataset: gold_product_category_revenue
version: "1.0.0"
owner: Analytics Team
classification: Internal
grain: one row per translated product category
freshness_slo_hours: 24

allowed_destinations:
  - gold/internal

primary_key:
  - product_category_name_english

columns:
  product_category_name_english:
    type: string
    required: true
    pii: false

  total_orders:
    type: integer
    required: true
    pii: false

  unique_customers:
    type: integer
    required: true
    pii: false

  units_sold:
    type: integer
    required: true
    pii: false

  product_revenue:
    type: decimal
    required: true
    pii: false

  freight_revenue:
    type: decimal
    required: true
    pii: false

  total_revenue:
    type: decimal
    required: true
    pii: false

  average_item_price:
    type: decimal
    required: true
    pii: false

  revenue_share_pct:
    type: decimal
    required: true
    pii: false

compatibility:
  allow_add_optional_column: true
  allow_remove_required_column: false
  allow_type_change_required_column: false
